name: Windows Release Smoke

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/windows-release-smoke.yml"
      - "src/desktop/**"
      - "public/**"
      - "scripts/release-shared.mjs"
      - "scripts/release-windows.mjs"
      - "scripts/test-suite.mjs"
      - "scripts/windows-smoke.ps1"
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - ".github/workflows/windows-release-smoke.yml"
      - "src/desktop/**"
      - "public/**"
      - "scripts/release-shared.mjs"
      - "scripts/release-windows.mjs"
      - "scripts/test-suite.mjs"
      - "scripts/windows-smoke.ps1"
      - "src/**"
      - "test/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  windows-release-smoke:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci:win

      - name: Build Windows portable package
        run: npm run portable:win

      - name: Write Windows release gate evidence
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/windows-smoke" | Out-Null
          $zip = Get-ChildItem -LiteralPath "dist" -Filter "GitLeaf-*-win32-x64.zip" |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $zip) {
            throw "Missing Windows portable ZIP"
          }
          $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $zip.FullName
          $package = Get-Content -LiteralPath "package.json" -Raw | ConvertFrom-Json
          [ordered]@{
            source = "github-actions"
            runnerOS = $env:RUNNER_OS
            workflow = $env:GITHUB_WORKFLOW
            runId = $env:GITHUB_RUN_ID
            runAttempt = $env:GITHUB_RUN_ATTEMPT
            repository = $env:GITHUB_REPOSITORY
            ref = $env:GITHUB_REF
            sha = $env:GITHUB_SHA
            version = $package.version
            artifact = $zip.Name
            sha256 = $hash.Hash.ToLowerInvariant()
          } | ConvertTo-Json | Set-Content -LiteralPath "dist/windows-smoke/release-gate.json" -Encoding utf8

      - name: Prepare smoke repository
        shell: pwsh
        run: |
          $smokeRepo = Join-Path $env:RUNNER_TEMP "git-leaf-smoke-repo"
          $smokeRemote = Join-Path $env:RUNNER_TEMP "git-leaf-smoke-remote.git"
          foreach ($smokePath in @($smokeRepo, $smokeRemote)) {
            if (Test-Path -LiteralPath $smokePath) {
              Remove-Item -LiteralPath $smokePath -Recurse -Force
            }
          }

          git init --bare --initial-branch=main $smokeRemote
          git clone $smokeRemote $smokeRepo
          New-Item -ItemType Directory -Path (Join-Path $smokeRepo "docs") | Out-Null

          Set-Content -LiteralPath (Join-Path $smokeRepo "README.md") -Encoding utf8 -Value @"
          # Git Leaf Smoke Repo

          This repository is generated by the Windows release smoke gate.

          ## Checks

          - Markdown preview renders
          - The file tree is populated
          - The packaged desktop app can open a normal Git repository
          "@

          Set-Content -LiteralPath (Join-Path $smokeRepo "docs\notes.md") -Encoding utf8 -Value @"
          # Notes

          A second document keeps navigation visible in the smoke screenshot.
          "@

          git -C $smokeRepo config user.name "Git Leaf Smoke"
          git -C $smokeRepo config user.email "git-leaf-smoke@example.invalid"
          git -C $smokeRepo add .
          git -C $smokeRepo commit -m "Create smoke repository"
          git -C $smokeRepo push -u origin main

          $hookPath = Join-Path $smokeRepo ".git\hooks\pre-commit"
          $hookSource = @'
          #!/bin/sh
          node -e "require('node:fs').writeFileSync('.git/git-leaf-hook-ran', 'ok')"
          '@
          [IO.File]::WriteAllText(
            $hookPath,
            ($hookSource.Trim() + "`n").Replace("`r`n", "`n"),
            [Text.UTF8Encoding]::new($false)
          )
          git -C $smokeRepo commit --allow-empty -m "Verify smoke hook runtime"
          $hookMarker = Join-Path $smokeRepo ".git\git-leaf-hook-ran"
          if (!(Test-Path -LiteralPath $hookMarker)) {
            throw "Git for Windows did not execute the smoke pre-commit hook"
          }
          git -C $smokeRepo push origin main
          Remove-Item -LiteralPath $hookMarker -Force

          Add-Content `
            -LiteralPath (Join-Path $smokeRepo "README.md") `
            -Encoding utf8 `
            -Value "`nThis unpublished edit must be synced through the packaged App."
          "GIT_LEAF_SMOKE_REPO=$smokeRepo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Launch packaged app and capture UI
        shell: pwsh
        run: >
          pwsh scripts/windows-smoke.ps1
          -AppRoot "dist/Git Leaf-win32-x64"
          -RepoRoot "$env:GIT_LEAF_SMOKE_REPO"
          -ScreenshotPath "dist/windows-smoke/home.png"
          -LogPath "dist/windows-smoke/windows-smoke.log"

      - name: Upload Windows release smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: git-leaf-windows-release-smoke-${{ github.run_number }}-${{ github.sha }}
          path: |
            dist/GitLeaf-*-win32-x64.zip
            dist/windows-smoke/release-gate.json
            dist/windows-smoke/home.png
            dist/windows-smoke/*.log
          if-no-files-found: error
          retention-days: 14
